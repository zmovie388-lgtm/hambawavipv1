<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061225"><title>Admin Panel | HAMBAWA VIP SPECIAL"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><div class="ambient"></div><main class="login-wrap" id="loginScreen"><a class="brand" href="/"><span class="brand-mark">H</span><span>HAMBAWA <b>VIP SPECIAL</b></span></a><section class="login-card"><div class="eyebrow">SECURE ADMIN ACCESS</div><h1>ADMIN PANEL<br><span>LOGIN</span></h1><p>Sign in to manage offers and website settings.</p><form id="loginForm"><label for="adminPassword">Admin Password</label><div class="password-wrap"><input id="adminPassword" type="password" autocomplete="current-password" required maxlength="200"><button type="button" id="togglePassword" aria-label="Show password">SHOW</button></div><button class="btn primary full" type="submit">ACCESS ADMIN PANEL <span>↗</span></button><p class="form-error" id="loginError" role="alert"></p></form><a class="back-link" href="/">← Back to public website</a></section><p class="login-foot">Protected session · Do not share your admin password</p></main>
<div class="dashboard hidden" id="dashboard"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">H</span><span>HAMBAWA <b>VIP</b></span></a><div class="side-label">WORKSPACE</div><nav id="sideNav"><button class="nav-item selected" data-view="dashboardView">▦ <span>Dashboard</span></button><button class="nav-item" data-view="offersView">▤ <span>Manage Offers</span></button><button class="nav-item" data-view="editorView" data-new="1">＋ <span>Add New Offer</span></button><button class="nav-item" data-view="settingsView">⚙ <span>Website Settings</span></button><button class="nav-item" data-view="passwordView">♙ <span>Change Password</span></button></nav><button id="logoutButton" class="logout-button">↪ <span>Logout</span></button><a class="view-site" href="/">↗ View public website</a></aside>
<section class="dash-main"><header class="dash-header"><div><span class="eyebrow">HAMBAWA VIP SPECIAL</span><h1 id="viewTitle">Dashboard</h1></div><div class="admin-badge"><span class="admin-avatar">A</span><span><b>Administrator</b><small>Secure session</small></span></div></header>
<div class="view" id="dashboardView"><div class="stat-grid"><article class="stat-card"><span>Total Offers</span><strong id="statTotal">0</strong><small>All saved offers</small></article><article class="stat-card"><span>Active Offers</span><strong id="statActive">0</strong><small>Visible to visitors</small></article><article class="stat-card"><span>Inactive Offers</span><strong id="statInactive">0</strong><small>Hidden or expired</small></article><article class="stat-card"><span>Expiring Soon</span><strong id="statExpiring">0</strong><small>Within 7 days</small></article></div><section class="panel"><div class="panel-heading"><div><h2>Recent offers</h2><p>Quick overview of your latest offer cards.</p></div><button class="btn primary" data-jump="editorView" data-new="1">＋ Add Offer</button></div><div id="recentOffers" class="offer-list"></div></section></div>
<div class="view hidden" id="offersView"><section class="panel"><div class="panel-heading"><div><h2>Manage Offers</h2><p>Edit prices, availability, and expiry dates.</p></div><button class="btn primary" data-jump="editorView" data-new="1">＋ Add Offer</button></div><div id="allOffers" class="offer-list"></div></section></div>
<div class="view hidden" id="editorView"><section class="panel form-panel"><div class="panel-heading"><div><h2 id="editorTitle">Add new offer</h2><p>Offers are saved in the database and shown on the homepage when active.</p></div></div><form id="offerForm" class="form-grid"><input type="hidden" id="offerId"><div class="field"><label for="offerTitle">Offer Title *</label><input id="offerTitle" maxlength="80" required placeholder="e.g. WEEKEND OFFER"></div><div class="field"><label for="buttonText">Button Text</label><input id="buttonText" maxlength="30" value="BUY NOW"></div><div class="field"><label for="originalPrice">Original Price (Rs.) *</label><input id="originalPrice" type="number" min="1" max="100000000" step="1" required></div><div class="field"><label for="discountedPrice">Discounted Price (Rs.) *</label><input id="discountedPrice" type="number" min="0" max="99999999" step="1" required></div><div class="field full"><label for="offerDescription">Offer Description</label><textarea id="offerDescription" rows="3" maxlength="500" placeholder="Describe what's included in this offer"></textarea></div><div class="field"><label for="expiryDate">Expiry Date (optional)</label><input id="expiryDate" type="date"></div><div class="field"><label for="offerActive">Status</label><select id="offerActive"><option value="true">Active</option><option value="false">Inactive</option></select></div><div class="form-actions full"><button type="submit" class="btn primary">SAVE OFFER</button><button type="button" class="btn secondary" id="previewOffer">PREVIEW OFFER</button><button type="button" class="btn ghost" id="cancelEdit">CANCEL</button></div><p class="form-error full" id="offerError" role="alert"></p></form><div id="previewBox" class="preview-box hidden"></div></section></div>
<div class="view hidden" id="settingsView"><section class="panel form-panel"><div class="panel-heading"><div><h2>Website Settings</h2><p>Update public contact links and homepage information.</p></div></div><form id="settingsForm" class="form-grid"><div class="field full"><label for="settingTitle">Website Title</label><input id="settingTitle" maxlength="80" required></div><div class="field full"><label for="settingGroup">Main Group URL (https://t.me/...)</label><input id="settingGroup" type="url" required></div><div class="field full"><label for="settingAdmin">Admin Telegram URL (https://t.me/...)</label><input id="settingAdmin" type="url" required></div><div class="field"><label for="settingPrice">Default Membership Price (Rs.)</label><input id="settingPrice" type="number" min="1" step="1" required></div><div class="field"><label for="settingContactLabel">Contact Button Label</label><input id="settingContactLabel" maxlength="30" required></div><div class="field full"><label for="settingAnnouncement">Homepage Announcement</label><textarea id="settingAnnouncement" maxlength="240" rows="3" placeholder="Optional announcement shown above offers"></textarea></div><div class="field full checkbox-field"><input id="settingVisibility" type="checkbox"><label for="settingVisibility">Show active offers on the public homepage</label></div><div class="form-actions full"><button class="btn primary" type="submit">SAVE SETTINGS</button></div><p class="form-error full" id="settingsError" role="alert"></p></form></section></div>
<div class="view hidden" id="passwordView"><section class="panel form-panel narrow-panel"><div class="panel-heading"><div><h2>Change Password</h2><p>Use a unique password with at least 12 characters.</p></div></div><form id="passwordForm" class="form-grid one-col"><div class="field full"><label for="currentPassword">Current Password</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="200"></div><div class="field full"><label for="newPassword">New Password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></div><div class="field full"><label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></div><div class="form-actions full"><button class="btn primary" type="submit">UPDATE PASSWORD</button></div><p class="form-error full" id="passwordError" role="alert"></p></form></section></div>
</section></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="confirmDialog" class="confirm-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><section class="confirm-card"><h2 id="confirmTitle">Delete this offer?</h2><p>This action cannot be undone.</p><div><button class="btn secondary" id="confirmCancel">CANCEL</button><button class="btn danger" id="confirmDelete">DELETE OFFER</button></div></section></div>
</body></html>
